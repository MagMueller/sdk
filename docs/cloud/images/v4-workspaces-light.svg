<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">One workspace shared across sessions</title>
  <desc id="desc">Two independent sessions read and write files in the same persistent workspace.</desc>
  <defs>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M1 1L7 4L1 7" fill="none" stroke="#FE750E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M1 1L7 4L1 7" fill="none" stroke="#A1A1AA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1200" height="320" rx="14" fill="#FFFFFF"/>

  <rect x="76" y="54" width="300" height="90" rx="12" fill="#FFFFFF" stroke="#FE750E" stroke-width="1.5"/>
  <circle cx="108" cy="99" r="6" fill="#FE750E"/>
  <text x="130" y="94" fill="#18181B" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600">Session A</text>
  <text x="130" y="119" fill="#71717A" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="14">research conversation</text>

  <rect x="76" y="176" width="300" height="90" rx="12" fill="#FAFAFA" stroke="#D4D4D8" stroke-width="1.5"/>
  <circle cx="108" cy="221" r="6" fill="#A1A1AA"/>
  <text x="130" y="216" fill="#18181B" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600">Session B</text>
  <text x="130" y="241" fill="#71717A" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="14">fresh conversation</text>

  <path d="M376 99C460 99 470 142 548 142" stroke="#FE750E" stroke-width="2" fill="none" marker-end="url(#arrow-orange)"/>
  <path d="M376 221C460 221 470 178 548 178" stroke="#A1A1AA" stroke-width="1.5" fill="none" marker-end="url(#arrow-gray)"/>

  <rect x="562" y="38" width="562" height="244" rx="14" fill="#FAFAFA" stroke="#D4D4D8" stroke-width="1.5"/>
  <text x="592" y="78" fill="#18181B" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="600">Workspace</text>
  <rect x="964" y="57" width="130" height="30" rx="7" fill="#F4F4F5"/>
  <text x="1029" y="77" text-anchor="middle" fill="#52525B" font-family="Geist Mono, ui-monospace, monospace" font-size="13">workspace_id</text>

  <rect x="592" y="108" width="502" height="42" rx="8" fill="#FFFFFF" stroke="#E4E4E7"/>
  <path d="M610 120H621L625 124H638V138H610V120Z" fill="#FE750E"/>
  <text x="654" y="135" fill="#3F3F46" font-family="Geist Mono, ui-monospace, monospace" font-size="14">people.csv</text>
  <text x="1067" y="135" text-anchor="end" fill="#71717A" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="13">input</text>

  <rect x="592" y="160" width="502" height="42" rx="8" fill="#FFFFFF" stroke="#E4E4E7"/>
  <path d="M610 172H621L625 176H638V190H610V172Z" fill="#71717A"/>
  <text x="654" y="187" fill="#3F3F46" font-family="Geist Mono, ui-monospace, monospace" font-size="14">script.py</text>
  <text x="1067" y="187" text-anchor="end" fill="#71717A" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="13">reusable</text>

  <rect x="592" y="212" width="502" height="42" rx="8" fill="#FFFFFF" stroke="#E4E4E7"/>
  <path d="M610 224H621L625 228H638V242H610V224Z" fill="#71717A"/>
  <text x="654" y="239" fill="#3F3F46" font-family="Geist Mono, ui-monospace, monospace" font-size="14">output.json</text>
  <text x="1067" y="239" text-anchor="end" fill="#71717A" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="13">generated</text>
</svg>
