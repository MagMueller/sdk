<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Task, session, run, and workspace relationship</title>
  <desc id="desc">A task starts a run inside a session. The run reads and writes files in a persistent workspace.</desc>
  <style>
    .heading{fill:#18181B;font:650 28px Geist,ui-sans-serif,system-ui,sans-serif}
    .label{fill:#18181B;font:620 25px Geist,ui-sans-serif,system-ui,sans-serif}
    .body{fill:#52525B;font:17px Geist,ui-sans-serif,system-ui,sans-serif}
    .mono{fill:#52525B;font:15px "Geist Mono",ui-monospace,monospace}
    rect:not(.canvas),circle{filter:url(#rough)}path{stroke-linecap:round;stroke-linejoin:round}
  </style>
  <defs>
    <filter id="rough" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency=".012 .025" numOctaves="2" seed="17" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#D95F00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect class="canvas" width="1200" height="520" rx="16" fill="#FFFFFF"/>

  <rect x="42" y="186" width="226" height="128" rx="14" fill="#FAFAFA" stroke="#D4D4D8" stroke-width="1.5"/>
  <circle cx="82" cy="250" r="8" fill="#D95F00"/>
  <text x="110" y="259" class="label">Task</text>
  <path d="M268 250H342" stroke="#D95F00" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="358" y="42" width="478" height="436" rx="16" fill="#FAFAFA" stroke="#D4D4D8" stroke-width="1.5"/>
  <text x="394" y="91" class="heading">Session</text>
  <rect x="650" y="64" width="150" height="36" rx="8" fill="#E4E4E7"/>
  <text x="725" y="88" class="mono" text-anchor="middle">session_id</text>

  <rect x="394" y="138" width="406" height="268" rx="14" fill="#FFFFFF" stroke="#D95F00" stroke-width="2"/>
  <rect x="430" y="178" width="58" height="58" rx="12" fill="#FFF0E5"/>
  <path d="M450 193L470 207L450 221V193Z" fill="#D95F00"/>
  <text x="516" y="211" class="heading">Run</text>
  <text x="430" y="277" class="body">conversation</text>
  <text x="430" y="313" class="body">live browser</text>
  <text x="430" y="349" class="body">events + result</text>
  <circle cx="690" cy="272" r="5" fill="#D95F00"/>
  <circle cx="690" cy="308" r="5" fill="#D95F00"/>
  <circle cx="690" cy="344" r="5" fill="#D95F00"/>
  <path d="M704 272H760M704 308H760M704 344H760" stroke="#D4D4D8" stroke-width="8" stroke-linecap="round"/>

  <path d="M836 250H908" stroke="#D95F00" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="924" y="106" width="234" height="310" rx="16" fill="#FAFAFA" stroke="#D4D4D8" stroke-width="1.5"/>
  <text x="954" y="154" class="heading">Workspace</text>
  <text x="954" y="188" class="body">persistent across runs</text>
  <rect x="954" y="226" width="174" height="58" rx="10" fill="#FFFFFF" stroke="#D4D4D8"/>
  <path d="M976 244H991L996 249H1014V269H976V244Z" fill="#D95F00"/>
  <text x="1030" y="263" class="mono">files</text>
  <rect x="954" y="304" width="174" height="58" rx="10" fill="#FFFFFF" stroke="#D4D4D8"/>
  <path d="M976 322H991L996 327H1014V347H976V322Z" fill="#71717A"/>
  <text x="1030" y="341" class="mono">scripts</text>
</svg>
