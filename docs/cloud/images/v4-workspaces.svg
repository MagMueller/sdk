<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480">
  <defs>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6d28d9"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e40af"/>
    </marker>
    <style>
      .title { font: 700 30px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #1e40af; }
      .label { font: 700 19px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #374151; }
      .body { font: 16px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #64748b; }
      .workspace { font: 700 21px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #047857; }
    </style>
  </defs>
  <rect width="1200" height="480" fill="#ffffff"/>
  <text x="66" y="60" class="title">A workspace persists beyond a session</text>

  <rect x="74" y="130" width="270" height="112" rx="14" fill="#ddd6fe" stroke="#6d28d9" stroke-width="3"/>
  <text x="209" y="171" text-anchor="middle" class="label">SESSION A</text>
  <text x="209" y="207" text-anchor="middle" class="body">Upload + create files</text>

  <rect x="74" y="300" width="270" height="112" rx="14" fill="#dbeafe" stroke="#1e40af" stroke-width="3" stroke-dasharray="9 8"/>
  <text x="209" y="341" text-anchor="middle" class="label">SESSION B</text>
  <text x="209" y="377" text-anchor="middle" class="body">Fresh session, same files</text>

  <path d="M 351 186 L 513 259" stroke="#6d28d9" stroke-width="3" fill="none" marker-end="url(#arrow-purple)"/>
  <path d="M 351 356 L 513 283" stroke="#1e40af" stroke-width="3" stroke-dasharray="9 8" fill="none" marker-end="url(#arrow-blue)"/>

  <rect x="523" y="120" width="584" height="300" rx="16" fill="#a7f3d0" stroke="#047857" stroke-width="3"/>
  <text x="815" y="164" text-anchor="middle" class="workspace">PERSISTENT WORKSPACE</text>

  <rect x="577" y="210" width="142" height="96" rx="12" fill="#93c5fd" stroke="#1e3a5f" stroke-width="3"/>
  <text x="648" y="264" text-anchor="middle" class="body">people.csv</text>
  <rect x="744" y="210" width="142" height="96" rx="12" fill="#93c5fd" stroke="#1e3a5f" stroke-width="3"/>
  <text x="815" y="264" text-anchor="middle" class="body">script.py</text>
  <rect x="911" y="210" width="142" height="96" rx="12" fill="#93c5fd" stroke="#1e3a5f" stroke-width="3"/>
  <text x="982" y="264" text-anchor="middle" class="body">output.json</text>

  <text x="815" y="365" text-anchor="middle" class="body">Reuse with workspace_id / workspaceId</text>
</svg>
