  <text x="986" y="150" fill="#D4D4D8" font-family="Geist Mono, ui-monospace, monospace" font-size="13">files</text>
  <rect x="928" y="174" width="184" height="36" rx="8" fill="#18181B" stroke="#3F3F46"/>
  <path d="M945 185H956L960 189H973V199H945V185Z" fill="#71717A"/>
