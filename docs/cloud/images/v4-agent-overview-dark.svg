<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Task, session, run, and workspace relationship</title>
  <desc id="desc">A task starts a run inside a session. The run reads and writes files in a persistent workspace.</desc>
