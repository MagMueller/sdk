    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M1 1L7 4L1 7" fill="none" stroke="#FE750E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1200" height="320" rx="14" fill="#09090B"/>

  <rect x="60" y="128" width="220" height="64" rx="12" fill="#18181B" stroke="#3F3F46" stroke-width="1.5"/>
  <circle cx="92" cy="160" r="6" fill="#FE750E"/>
  <text x="112" y="168" fill="#FAFAFA" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="600">Task</text>

  <path d="M280 160H356" stroke="#FE750E" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="370" y="46" width="430" height="228" rx="14" fill="#111113" stroke="#3F3F46" stroke-width="1.5"/>
  <text x="398" y="84" fill="#FAFAFA" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="600">Session</text>
  <rect x="650" y="62" width="120" height="30" rx="7" fill="#27272A"/>
  <text x="710" y="82" fill="#A1A1AA" text-anchor="middle" font-family="Geist Mono, ui-monospace, monospace" font-size="13">session_id</text>

  <rect x="402" y="116" width="366" height="126" rx="12" fill="#18181B" stroke="#FE750E" stroke-width="1.5"/>
  <rect x="422" y="136" width="40" height="40" rx="10" fill="#30190B"/>
  <path d="M436 147L449 156L436 165V147Z" fill="#FE750E"/>
  <text x="482" y="158" fill="#FAFAFA" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="600">Run</text>
  <text x="482" y="188" fill="#A1A1AA" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="15">conversation + live browser</text>

  <path d="M800 160H886" stroke="#FE750E" stroke-width="2" marker-end="url(#arrow)"/>

