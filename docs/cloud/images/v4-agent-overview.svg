<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460">
  <defs>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6d28d9"/>
    </marker>
    <style>
      .title { font: 700 30px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #1e40af; }
      .label { font: 700 20px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #374151; }
      .body { font: 16px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #64748b; }
      .small { font: 15px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #64748b; }
    </style>
  </defs>
  <rect width="1200" height="460" fill="#ffffff"/>
  <text x="66" y="60" class="title">One task creates the context around it</text>

  <rect x="70" y="160" width="225" height="120" rx="14" fill="#fed7aa" stroke="#c2410c" stroke-width="3"/>
  <text x="182.5" y="207" text-anchor="middle" class="label">YOUR TASK</text>
  <text x="182.5" y="240" text-anchor="middle" class="body">Natural-language goal</text>
  <path d="M 302 220 H 390" stroke="#c2410c" stroke-width="3" fill="none" marker-end="url(#arrow-orange)"/>

  <rect x="400" y="110" width="325" height="220" rx="16" fill="#ddd6fe" stroke="#6d28d9" stroke-width="3"/>
  <text x="562.5" y="148" text-anchor="middle" class="label" fill="#6d28d9">SESSION</text>
  <rect x="440" y="180" width="245" height="80" rx="12" fill="#93c5fd" stroke="#1e3a5f" stroke-width="3"/>
  <text x="562.5" y="212" text-anchor="middle" class="label">RUN</text>
  <text x="562.5" y="241" text-anchor="middle" class="body">Executes one turn</text>
  <text x="562.5" y="302" text-anchor="middle" class="small">conversation + live browser</text>

  <path d="M 732 220 H 818" stroke="#6d28d9" stroke-width="3" fill="none" marker-end="url(#arrow-purple)"/>
  <rect x="828" y="135" width="292" height="175" rx="16" fill="#a7f3d0" stroke="#047857" stroke-width="3"/>
  <text x="974" y="181" text-anchor="middle" class="label">WORKSPACE</text>
  <text x="974" y="220" text-anchor="middle" class="body">Persistent files</text>
  <text x="974" y="254" text-anchor="middle" class="small">inputs • scripts • outputs</text>

  <text x="600" y="405" text-anchor="middle" class="body">Omit both IDs and API V4 creates the session and workspace automatically.</text>
</svg>
