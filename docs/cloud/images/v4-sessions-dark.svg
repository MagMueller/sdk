<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Multiple runs in one session</title>
  <desc id="desc">Three sequential runs share one session ID, conversation, workspace, and live browser.</desc>
  <style>
    .heading{fill:#FAFAFA;font:650 28px Geist,ui-sans-serif,system-ui,sans-serif}
    .label{fill:#FAFAFA;font:620 23px Geist,ui-sans-serif,system-ui,sans-serif}
    .body{fill:#A1A1AA;font:17px Geist,ui-sans-serif,system-ui,sans-serif}
    .mono{fill:#A1A1AA;font:15px "Geist Mono",ui-monospace,monospace}
    rect:not(.canvas),circle{filter:url(#rough)}path{stroke-linecap:round;stroke-linejoin:round}
  </style>
  <defs>
    <filter id="rough" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency=".012 .025" numOctaves="2" seed="23" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#71717A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect class="canvas" width="1200" height="520" rx="16" fill="#09090B"/>
  <rect x="46" y="42" width="1108" height="436" rx="16" fill="#111113" stroke="#3F3F46" stroke-width="1.5"/>
  <text x="82" y="92" class="heading">Session</text>
  <rect x="224" y="63" width="178" height="38" rx="8" fill="#27272A"/>
  <text x="313" y="88" class="mono" text-anchor="middle">ses_8f21…</text>

  <path d="M192 255H1002" stroke="#71717A" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="94" y="152" width="286" height="196" rx="14" fill="#18181B" stroke="#FE750E" stroke-width="2"/>
  <circle cx="132" cy="255" r="9" fill="#FE750E"/>
  <text x="132" y="201" class="label">Run 01</text>
  <text x="132" y="296" class="body">Open Hacker News</text>
  <text x="132" y="324" class="mono">sessionId: ses_8f21…</text>

  <rect x="457" y="152" width="286" height="196" rx="14" fill="#18181B" stroke="#3F3F46" stroke-width="1.5"/>
  <circle cx="495" cy="255" r="9" fill="#52525B"/>
  <text x="495" y="201" class="label">Run 02</text>
  <text x="495" y="296" class="body">Summarize the story</text>
  <text x="495" y="324" class="mono">sessionId: ses_8f21…</text>

  <rect x="820" y="152" width="286" height="196" rx="14" fill="#18181B" stroke="#3F3F46" stroke-width="1.5"/>
  <circle cx="858" cy="255" r="9" fill="#52525B"/>
  <text x="858" y="201" class="label">Run 03</text>
  <text x="858" y="296" class="body">Continue the task</text>
  <text x="858" y="324" class="mono">sessionId: ses_8f21…</text>

  <text x="600" y="420" class="body" text-anchor="middle">same conversation · same workspace · same live browser</text>
</svg>
