<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Save, reuse, and repair a browser script</title>
  <desc id="desc">The first run saves a script and README in a workspace. Later runs reuse the files and can repair the script.</desc>
  <defs>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency=".012" numOctaves="2" seed="23" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="1.8"/></filter>
    <pattern id="orangeHatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(18)"><line x1="0" y1="0" x2="0" y2="12" stroke="#fed7aa" stroke-width="4"/></pattern>
    <pattern id="purpleHatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(18)"><line x1="0" y1="0" x2="0" y2="12" stroke="#ddd6fe" stroke-width="4"/></pattern>
    <pattern id="greenHatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(18)"><line x1="0" y1="0" x2="0" y2="12" stroke="#a7f3d0" stroke-width="4"/></pattern>
  </defs>
  <rect width="1200" height="430" fill="#09090B"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#rough)">
    <rect x="50" y="142" width="220" height="116" rx="24" fill="#24140B" stroke="#FE750E" stroke-width="4"/>
    <path d="M282 200 C325 194 353 207 397 200" stroke="#FE750E" stroke-width="4"/>
    <path d="M378 187 L399 200 L379 214" stroke="#FE750E" stroke-width="4"/>
    <path d="M412 77 L788 77 L788 319 L412 319 Z" fill="#1D1714" stroke="#FE750E" stroke-width="4"/>
    <path d="M412 77 L490 77 L512 52 L620 52 L642 77" fill="#1D1714" stroke="#FE750E" stroke-width="4"/>
    <path d="M470 150 L595 150 L595 267 L470 267 Z M470 150 L570 150 L595 175" fill="#18181B" stroke="#A1A1AA" stroke-width="3"/>
    <path d="M615 150 L730 150 L730 267 L615 267 Z M615 150 L705 150 L730 175" fill="#18181B" stroke="#A1A1AA" stroke-width="3"/>
    <path d="M800 200 C843 207 871 194 915 200" stroke="#FE750E" stroke-width="4"/>
    <path d="M896 187 L917 200 L897 214" stroke="#FE750E" stroke-width="4"/>
    <rect x="930" y="142" width="220" height="116" rx="24" fill="#1D1714" stroke="#FE750E" stroke-width="4"/>
    <path d="M1040 274 C1025 358 875 382 704 342 C631 325 565 299 535 276" stroke="#FE750E" stroke-width="3" stroke-dasharray="12 9"/>
    <path d="M553 279 L533 274 L538 294" stroke="#FE750E" stroke-width="3"/>
  </g>
  <g font-family="Virgil, Comic Sans MS, cursive" text-anchor="middle">
    <text x="160" y="210" font-size="29" fill="#F4F4F5">RUN 1</text>
    <text x="600" y="121" font-size="28" fill="#FE750E">WORKSPACE</text>
    <text x="533" y="216" font-size="20" fill="#F4F4F5">script.py</text>
    <text x="673" y="216" font-size="20" fill="#F4F4F5">README</text>
    <text x="1040" y="210" font-size="29" fill="#F4F4F5">RUN 2+</text>
  </g>
</svg>
