<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Multiple runs in one session</title>
  <desc id="desc">Three sequential runs share one session ID, conversation, workspace, and live browser.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M1 1L7 4L1 7" fill="none" stroke="#A1A1AA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1200" height="320" rx="14" fill="#FFFFFF"/>
  <rect x="70" y="40" width="1060" height="240" rx="14" fill="#FAFAFA" stroke="#D4D4D8" stroke-width="1.5"/>
  <text x="100" y="82" fill="#18181B" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="600">Session</text>
  <rect x="200" y="60" width="190" height="30" rx="7" fill="#F4F4F5"/>
  <text x="295" y="80" text-anchor="middle" fill="#52525B" font-family="Geist Mono, ui-monospace, monospace" font-size="13">ses_8f21…</text>
  <path d="M244 175H934" stroke="#A1A1AA" stroke-width="1.5" marker-end="url(#arrow)"/>

  <circle cx="278" cy="175" r="8" fill="#FE750E"/>
  <rect x="164" y="116" width="228" height="96" rx="12" fill="#FFFFFF" stroke="#FE750E" stroke-width="1.5"/>
  <text x="190" y="151" fill="#18181B" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600">Run 01</text>
  <text x="190" y="180" fill="#71717A" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="14">Open Hacker News</text>

  <circle cx="600" cy="175" r="8" fill="#D4D4D8"/>
  <rect x="486" y="116" width="228" height="96" rx="12" fill="#FFFFFF" stroke="#D4D4D8" stroke-width="1.5"/>
  <text x="512" y="151" fill="#18181B" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600">Run 02</text>
  <text x="512" y="180" fill="#71717A" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="14">Summarize the story</text>

  <circle cx="922" cy="175" r="8" fill="#D4D4D8"/>
  <rect x="808" y="116" width="228" height="96" rx="12" fill="#FFFFFF" stroke="#D4D4D8" stroke-width="1.5"/>
  <text x="834" y="151" fill="#18181B" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600">Run 03</text>
  <text x="834" y="180" fill="#71717A" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="14">Continue the task</text>

  <text x="600" y="249" text-anchor="middle" fill="#71717A" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="14">same conversation · same workspace · same live browser</text>
</svg>
