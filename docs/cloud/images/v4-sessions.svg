<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e3a5f"/>
    </marker>
    <style>
      .title { font: 700 30px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #1e40af; }
      .label { font: 700 19px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #374151; }
      .body { font: 16px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #64748b; }
      .session { font: 700 20px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #6d28d9; }
    </style>
  </defs>
  <rect width="1200" height="460" fill="#ffffff"/>
  <text x="66" y="60" class="title">A session is a conversation</text>
  <rect x="66" y="110" width="1048" height="250" rx="16" fill="#ddd6fe" stroke="#6d28d9" stroke-width="3"/>
  <text x="98" y="150" class="session">ONE SESSION ID</text>

  <rect x="106" y="192" width="245" height="92" rx="12" fill="#93c5fd" stroke="#1e3a5f" stroke-width="3"/>
  <text x="228.5" y="226" text-anchor="middle" class="label">RUN 1</text>
  <text x="228.5" y="258" text-anchor="middle" class="body">“Open Hacker News”</text>
  <path d="M 358 238 H 440" stroke="#1e3a5f" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <rect x="450" y="192" width="280" height="92" rx="12" fill="#60a5fa" stroke="#1e3a5f" stroke-width="3"/>
  <text x="590" y="226" text-anchor="middle" class="label">RUN 2</text>
  <text x="590" y="258" text-anchor="middle" class="body">“Summarize the top story”</text>
  <path d="M 737 238 H 819" stroke="#1e3a5f" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <rect x="829" y="192" width="245" height="92" rx="12" fill="#93c5fd" stroke="#1e3a5f" stroke-width="3"/>
  <text x="951.5" y="226" text-anchor="middle" class="label">RUN 3</text>
  <text x="951.5" y="258" text-anchor="middle" class="body">Another follow-up</text>

  <text x="600" y="405" text-anchor="middle" class="body">Conversation, workspace, and the live browser carry into each follow-up.</text>
</svg>
