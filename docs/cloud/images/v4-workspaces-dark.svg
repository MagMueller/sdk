<svg width="1200" height="540" viewBox="0 0 1200 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">One workspace shared across sessions</title>
  <desc id="desc">Two independent sessions read and write files in the same persistent workspace.</desc>
  <style>
    .heading{fill:#FAFAFA;font:650 28px Geist,ui-sans-serif,system-ui,sans-serif}
    .label{fill:#FAFAFA;font:620 23px Geist,ui-sans-serif,system-ui,sans-serif}
    .body{fill:#A1A1AA;font:17px Geist,ui-sans-serif,system-ui,sans-serif}
    .mono{fill:#D4D4D8;font:16px "Geist Mono",ui-monospace,monospace}
    rect:not(.canvas),circle{filter:url(#rough)}path{stroke-linecap:round;stroke-linejoin:round}
  </style>
  <defs>
    <filter id="rough" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency=".012 .025" numOctaves="2" seed="31" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="orange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#FE750E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="gray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#71717A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect class="canvas" width="1200" height="540" rx="16" fill="#09090B"/>

  <rect x="48" y="74" width="330" height="158" rx="14" fill="#18181B" stroke="#FE750E" stroke-width="2"/>
  <circle cx="90" cy="130" r="8" fill="#FE750E"/>
  <text x="118" y="137" class="label">Session A</text>
  <text x="90" y="184" class="body">research conversation</text>
  <text x="90" y="210" class="body">reads + writes files</text>

  <rect x="48" y="308" width="330" height="158" rx="14" fill="#18181B" stroke="#3F3F46" stroke-width="1.5"/>
  <circle cx="90" cy="364" r="8" fill="#71717A"/>
  <text x="118" y="371" class="label">Session B</text>
  <text x="90" y="418" class="body">fresh conversation</text>
  <text x="90" y="444" class="body">reuses the same files</text>

  <path d="M378 153C470 153 478 222 548 222" stroke="#FE750E" stroke-width="2.5" fill="none" marker-end="url(#orange)"/>
  <path d="M378 387C470 387 478 318 548 318" stroke="#71717A" stroke-width="2" fill="none" marker-end="url(#gray)"/>

  <rect x="566" y="42" width="586" height="456" rx="16" fill="#111113" stroke="#3F3F46" stroke-width="1.5"/>
  <text x="602" y="92" class="heading">Workspace</text>
  <text x="602" y="124" class="body">persistent files shared across sessions</text>
  <rect x="936" y="66" width="180" height="38" rx="8" fill="#27272A"/>
  <text x="1026" y="91" text-anchor="middle" class="body">workspace_id</text>

  <rect x="602" y="166" width="514" height="74" rx="11" fill="#18181B" stroke="#FE750E" stroke-width="1.5"/>
  <path d="M628 187H645L651 193H674V219H628V187Z" fill="#FE750E"/>
  <text x="700" y="210" class="mono">people.csv</text>
  <text x="1082" y="210" text-anchor="end" class="body">input</text>

  <rect x="602" y="258" width="514" height="74" rx="11" fill="#18181B" stroke="#3F3F46"/>
  <path d="M628 279H645L651 285H674V311H628V279Z" fill="#71717A"/>
  <text x="700" y="302" class="mono">script.py</text>
  <text x="1082" y="302" text-anchor="end" class="body">reusable</text>

  <rect x="602" y="350" width="514" height="74" rx="11" fill="#18181B" stroke="#3F3F46"/>
  <path d="M628 371H645L651 377H674V403H628V371Z" fill="#71717A"/>
  <text x="700" y="394" class="mono">output.json</text>
  <text x="1082" y="394" text-anchor="end" class="body">generated</text>
</svg>
