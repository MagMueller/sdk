<svg width="1200" height="560" viewBox="0 0 1200 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Save and reuse tested scripts</title>
  <desc id="desc">A first run creates and tests a script in a workspace. Later runs reuse it and repair it only if the site changes.</desc>
  <style>
    .heading{fill:#18181B;font:650 27px Geist,ui-sans-serif,system-ui,sans-serif}
    .label{fill:#18181B;font:620 24px Geist,ui-sans-serif,system-ui,sans-serif}
    .body{fill:#52525B;font:17px Geist,ui-sans-serif,system-ui,sans-serif}
    .mono{fill:#3F3F46;font:16px "Geist Mono",ui-monospace,monospace}
    rect:not(.canvas),circle{filter:url(#rough)}path{stroke-linecap:round;stroke-linejoin:round}
  </style>
  <defs>
    <filter id="rough" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency=".012 .025" numOctaves="2" seed="37" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="orange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#D95F00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="gray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#71717A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect class="canvas" width="1200" height="560" rx="16" fill="#FFFFFF"/>

  <rect x="42" y="142" width="278" height="228" rx="15" fill="#FFFFFF" stroke="#D95F00" stroke-width="2"/>
  <rect x="74" y="178" width="54" height="54" rx="12" fill="#FFF0E5"/>
  <path d="M93 191L111 205L93 219V191Z" fill="#D95F00"/>
  <text x="150" y="212" class="label">Run 01</text>
  <text x="74" y="278" class="body">create the workflow</text>
  <text x="74" y="310" class="body">test it in the browser</text>
  <text x="74" y="342" class="body">save reuse instructions</text>

  <path d="M320 256H390" stroke="#D95F00" stroke-width="2.5" marker-end="url(#orange)"/>

  <rect x="406" y="46" width="388" height="430" rx="16" fill="#FAFAFA" stroke="#D4D4D8" stroke-width="1.5"/>
  <text x="442" y="96" class="heading">Workspace</text>
  <text x="442" y="128" class="body">the reusable source of truth</text>

  <rect x="442" y="172" width="316" height="96" rx="12" fill="#FFFFFF" stroke="#D95F00" stroke-width="2"/>
  <path d="M470 196H488L494 202H520V242H470V196Z" fill="#D95F00"/>
  <text x="548" y="221" class="mono">script.py</text>
  <text x="548" y="246" class="body">tested automation</text>

  <rect x="442" y="294" width="316" height="96" rx="12" fill="#FFFFFF" stroke="#D4D4D8"/>
  <path d="M470 318H488L494 324H520V364H470V318Z" fill="#71717A"/>
  <text x="548" y="343" class="mono">README.md</text>
  <text x="548" y="368" class="body">how to run it again</text>

  <path d="M794 256H864" stroke="#D95F00" stroke-width="2.5" marker-end="url(#orange)"/>

  <rect x="880" y="142" width="278" height="228" rx="15" fill="#FAFAFA" stroke="#D4D4D8" stroke-width="1.5"/>
  <rect x="912" y="178" width="54" height="54" rx="12" fill="#E4E4E7"/>
  <path d="M931 191L949 205L931 219V191Z" fill="#71717A"/>
  <text x="988" y="212" class="label">Run 02+</text>
  <text x="912" y="278" class="body">reuse the saved script</text>
  <text x="912" y="310" class="body">skip repeated reasoning</text>
  <text x="912" y="342" class="body">finish faster for less</text>

  <path d="M1019 370V435C1019 482 966 514 910 514H650C612 514 592 499 592 472" stroke="#71717A" stroke-width="2" stroke-dasharray="7 8" fill="none" marker-end="url(#gray)"/>
  <rect x="734" y="487" width="216" height="40" rx="9" fill="#E4E4E7"/>
  <text x="842" y="513" text-anchor="middle" class="body">repair only if the site changes</text>
</svg>
