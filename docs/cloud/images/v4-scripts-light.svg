<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Save and reuse tested scripts</title>
  <desc id="desc">A first run creates and tests a script in a workspace. Later runs reuse it and repair it only if the site changes.</desc>
  <defs>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M1 1L7 4L1 7" fill="none" stroke="#FE750E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M1 1L7 4L1 7" fill="none" stroke="#A1A1AA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1200" height="320" rx="14" fill="#FFFFFF"/>

  <rect x="58" y="92" width="248" height="136" rx="12" fill="#FFFFFF" stroke="#FE750E" stroke-width="1.5"/>
  <rect x="82" y="116" width="38" height="38" rx="9" fill="#FFF1E7"/>
  <path d="M95 126L108 135L95 144V126Z" fill="#FE750E"/>
  <text x="136" y="138" fill="#18181B" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="600">Run 01</text>
  <text x="82" y="186" fill="#71717A" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="14">create · test · document</text>

  <path d="M306 160H418" stroke="#FE750E" stroke-width="2" marker-end="url(#arrow-orange)"/>

  <rect x="432" y="46" width="336" height="228" rx="14" fill="#FAFAFA" stroke="#D4D4D8" stroke-width="1.5"/>
  <text x="460" y="84" fill="#18181B" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="600">Workspace</text>
  <rect x="460" y="108" width="280" height="56" rx="9" fill="#FFFFFF" stroke="#FE750E" stroke-width="1.5"/>
  <path d="M480 122H491L495 126H508V149H480V122Z" fill="#FE750E"/>
  <text x="526" y="142" fill="#3F3F46" font-family="Geist Mono, ui-monospace, monospace" font-size="14">script.py</text>
  <rect x="460" y="176" width="280" height="56" rx="9" fill="#FFFFFF" stroke="#E4E4E7"/>
  <path d="M480 190H491L495 194H508V217H480V190Z" fill="#A1A1AA"/>
  <text x="526" y="210" fill="#3F3F46" font-family="Geist Mono, ui-monospace, monospace" font-size="14">README.md</text>

  <path d="M768 160H880" stroke="#FE750E" stroke-width="2" marker-end="url(#arrow-orange)"/>

  <rect x="894" y="92" width="248" height="136" rx="12" fill="#FAFAFA" stroke="#D4D4D8" stroke-width="1.5"/>
  <rect x="918" y="116" width="38" height="38" rx="9" fill="#F4F4F5"/>
  <path d="M931 126L944 135L931 144V126Z" fill="#71717A"/>
  <text x="972" y="138" fill="#18181B" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="600">Run 02+</text>
  <text x="918" y="186" fill="#71717A" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="14">reuse first</text>

  <path d="M1018 228V260C1018 280 994 292 974 292H600C578 292 562 282 562 264V246" stroke="#A1A1AA" stroke-width="1.5" stroke-dasharray="5 6" fill="none" marker-end="url(#arrow-gray)"/>
  <rect x="735" y="270" width="168" height="28" rx="7" fill="#F4F4F5"/>
  <text x="819" y="289" text-anchor="middle" fill="#52525B" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-size="13">repair only if needed</text>
</svg>
